spring:
  application:
    name: ai-data-analyst

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_data_analyst
    username: ai_agent_users
    password: Pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    upload-directory: ./uploads
    upload:
      max-file-size: 50MB
      allowed-file-types:
        - xlsx
        - xls
        - csv
server:
  port: 8080
